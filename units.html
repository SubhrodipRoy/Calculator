<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTA // Units</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="units.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.1/math.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark pulse">V9</div>
      <div>
        <h1>VANTA <span style="color:var(--accent2)">//</span> Compute Console</h1>
        <p>Multi-domain analytical instrument</p>
      </div>
    </div>
    <div class="status">
      <div><span class="dot pulse"></span><b>Core</b> Online</div>
      <div><b>Mode</b> Units</div>
      <div><b>Precision</b> f64</div>
    </div>
  </header>
  <nav class="tabs">
        <a href="index.html">Standard</a>
        <a href="stats.html">Statistics</a>
        <a href="matrix.html">Matrix</a>
        <a href="graph.html">Graph</a>
        <a href="3d.html">3D</a>
        <a href="units.html" class="active">Units</a>
        <a href="base.html">Base / Bitwise</a>
  </nav>

  <div class="grid">
    <div class="panel">
      <div class="field">
        <label class="small">Category</label>
        <select id="convCat"></select>
      </div>
      <div class="two-col">
        <div>
          <label class="small">From</label>
          <select id="convFrom"></select>
          <input type="text" id="convVal" value="1" style="margin-top:8px;">
        </div>
        <div>
          <label class="small">To</label>
          <select id="convTo"></select>
          <div style="margin-top:8px; background:#0A1220; border:1px solid var(--line); border-radius:6px; padding:9px 10px; color:var(--accent); font-weight:600;" id="convResult">—</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="side-title">History <button id="clearHist">Clear</button></div>
      <div class="hist-list" id="histList"><div class="hist-empty">No calculations yet</div></div>
      <div class="mem-box">
        <div class="mem-row"><span>Memory</span><b id="memVal">0</b></div>
        <div class="row-tools">
          <button id="mPlus">M+</button>
          <button id="mMinus">M−</button>
          <button id="mR">MR</button>
          <button id="mC">MC</button>
        </div>
      </div>
    </div>
  </div>

  <footer>VANTA-9 &nbsp;·&nbsp; local computation only &nbsp;·&nbsp; no data leaves this session</footer>
</div>

<script src="units.js"></script>
</body>
</html>
