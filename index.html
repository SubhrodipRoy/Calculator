<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTA // Standard Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#060A12;
  --panel:#0C131F;
  --panel-2:#101A29;
  --line: rgba(63,224,208,0.18);
  --line-strong: rgba(63,224,208,0.4);
  --accent:#3FE0D0;
  --accent-dim: rgba(63,224,208,0.5);
  --accent2:#C77DFF;
  --warn:#FF6B6B;
  --text:#DCEEFF;
  --text-dim:#5F7A94;
  --text-dim2:#3A4A5C;
  --radius:10px;
  --mono: 'JetBrains Mono', monospace;
  --display: 'Space Grotesk', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--void);
  color:var(--text);
  font-family:var(--mono);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:42px 42px;
  opacity:0.12;
  pointer-events:none;
  mask-image: radial-gradient(ellipse at 50% 0%, black 0%, transparent 75%);
}
body::after{
  content:"";
  position:fixed; inset:0;
  background: radial-gradient(ellipse 900px 500px at 20% -10%, rgba(63,224,208,0.10), transparent 60%),
              radial-gradient(ellipse 700px 500px at 100% 10%, rgba(199,125,255,0.08), transparent 60%);
  pointer-events:none;
}
@media (prefers-reduced-motion: no-preference){
  .pulse{ animation: pulseGlow 3.2s ease-in-out infinite; }
}
@keyframes pulseGlow{
  0%,100%{ opacity:1; }
  50%{ opacity:0.55; }
}
.wrap{
  position:relative; z-index:1;
  max-width:1180px;
  margin:0 auto;
  padding:22px 18px 60px;
}
header.top{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
  margin-bottom:18px;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-mark{
  width:34px;height:34px;border:1px solid var(--line-strong);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  font-family:var(--display); font-weight:700; font-size:15px;
  box-shadow:0 0 14px rgba(63,224,208,0.25) inset;
}
.brand h1{
  font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:0.5px;
  margin:0; color:var(--text);
}
.brand p{
  margin:2px 0 0; font-size:11px; color:var(--text-dim); letter-spacing:1.5px; text-transform:uppercase;
}
.status{
  display:flex; gap:18px; font-size:11px; color:var(--text-dim); letter-spacing:0.5px;
}
.status b{ color:var(--accent); font-weight:600; }
.status .dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--accent); margin-right:6px; box-shadow:0 0 8px var(--accent);
}
nav.tabs{
  display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;
}
nav.tabs a{
  text-decoration:none; display:inline-block;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text-dim);
  font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase;
  padding:9px 14px; border-radius:7px; cursor:pointer;
  transition:all .15s ease;
}
nav.tabs a:hover{ color:var(--text); border-color:var(--line-strong); }
nav.tabs a.active{
  color:var(--void); background:var(--accent); border-color:var(--accent);
  box-shadow:0 0 16px rgba(63,224,208,0.35);
  font-weight:700;
}
.grid{
  display:grid;
  grid-template-columns: 1fr 300px;
  gap:16px;
  align-items:start;
}
@media (max-width: 880px){
  .grid{ grid-template-columns: 1fr; }
}
.panel{
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  position:relative;
}
.panel::before, .panel::after{
  content:""; position:absolute; width:10px; height:10px;
  border-top:1px solid var(--accent-dim); border-left:1px solid var(--accent-dim);
  top:-1px; left:-1px;
}
.panel::after{
  left:auto; right:-1px; top:auto; bottom:-1px;
  border-top:none; border-left:none;
  border-bottom:1px solid var(--accent-dim); border-right:1px solid var(--accent-dim);
}
label.small{ font-size:10px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:6px; }
input[type=text], input[type=number], select, textarea{
  width:100%; background:#0A1220; border:1px solid var(--line); color:var(--text);
  font-family:var(--mono); font-size:13px; padding:9px 10px; border-radius:6px; outline:none;
}
input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus{ border-color:var(--accent); }
.field{ margin-bottom:12px; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.three-col{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.row-tools{
  display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;
  position:relative;
}
.row-tools button{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
  font-family:var(--mono); font-size:11px; padding:7px 10px; border-radius:6px; cursor:pointer;
  letter-spacing:0.5px;
}
.row-tools button:hover{ color:var(--text); border-color:var(--line-strong); }
.row-tools button.on{ color:var(--accent); border-color:var(--accent); background:rgba(63,224,208,0.08); }
.hist-list{ display:flex; flex-direction:column; gap:8px; max-height:520px; overflow-y:auto; padding-right:4px;}
.hist-item{
  background:#0A121F; border:1px solid var(--line); border-radius:7px; padding:8px 10px; cursor:pointer;
}
.hist-item:hover{ border-color:var(--line-strong); }
.hist-item .h-expr{ font-size:11px; color:var(--text-dim); word-break:break-all;}
.hist-item .h-res{ font-size:14px; color:var(--accent); font-weight:600; margin-top:2px;}
.hist-empty{ color:var(--text-dim2); font-size:12px; text-align:center; padding:30px 0; }
.side-title{ font-family:var(--display); font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--text); margin:0 0 10px; display:flex; justify-content:space-between; align-items:center;}
.side-title button{ background:none; border:1px solid var(--line); color:var(--text-dim); font-size:10px; padding:4px 8px; border-radius:5px; cursor:pointer; font-family:var(--mono); }
.mem-box{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
.mem-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:6px; }
.mem-row b{ color:var(--accent2); }
.hidden{ display:none !important; }
.hint{ font-size:11px; color:var(--text-dim2); margin-top:8px; line-height:1.5; }
footer{ text-align:center; color:var(--text-dim2); font-size:10px; margin-top:26px; letter-spacing:1px; }
.stat-table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:12px;}
.stat-table td{ padding:7px 8px; border-bottom:1px solid var(--line); }
.stat-table td:first-child{ color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; font-size:10px;}
.stat-table td:last-child{ text-align:right; color:var(--accent); font-weight:600;}

/* display + keypad */
.display{
  background:#05090F;
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px 16px 14px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}
.display .prev{
  min-height:16px;
  font-size:12px; color:var(--text-dim);
  text-align:right; word-wrap:break-word; letter-spacing:0.3px;
}
.display .cur{
  width:100%; background:transparent; border:none; outline:none;
  color:var(--text); font-family:var(--mono); font-weight:600;
  font-size:clamp(22px,4.5vw,34px);
  text-align:right; letter-spacing:1px;
  text-shadow:0 0 18px rgba(63,224,208,0.35);
  caret-color:var(--accent);
}
.display .meta{
  display:flex; justify-content:space-between; margin-top:8px;
  font-size:10px; color:var(--text-dim2); letter-spacing:1px; text-transform:uppercase;
}
.display .meta span.on{ color:var(--accent); }
.scan{
  position:absolute; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  top:0; opacity:0.6;
}
@media (prefers-reduced-motion: no-preference){
  .scan{ animation: scanmove 4s linear infinite; }
}
@keyframes scanmove{ 0%{top:0;} 100%{top:100%;} }
.pad{ display:grid; gap:8px; }
.pad.std{ grid-template-columns: repeat(4,1fr); }
.pad.sci{ grid-template-columns: repeat(5,1fr); }
button.key{
  background:#101B29; border:1px solid var(--line);
  color:var(--text); font-family:var(--mono); font-size:14px; font-weight:600;
  padding:12px 4px; border-radius:8px; cursor:pointer;
  transition:transform .06s ease, border-color .15s ease, background .15s ease;
}
button.key:hover{ border-color:var(--line-strong); background:#132234; }
button.key:active{ transform:scale(0.95); }
button.key.op{ color:var(--accent); }
button.key.fn{ color:var(--accent2); font-size:12px; }
button.key.eq{ background:var(--accent); color:var(--void); border-color:var(--accent); font-weight:700; }
button.key.eq:hover{ background:#5CEBDC; }
button.key.warn{ color:var(--warn); }
button.key.wide{ grid-column: span 2; }
button.key.ghost{ background:transparent; color:var(--text-dim); }
button.key.toggleon{ background:rgba(63,224,208,0.15); border-color:var(--accent); color:var(--accent); }

/* physical constants dropdown */
.const-wrap{ position:relative; }
.const-btn{
  background:rgba(199,125,255,0.10); border:1px solid rgba(199,125,255,0.4); color:var(--accent2);
  font-family:var(--mono); font-size:11px; padding:7px 12px; border-radius:6px; cursor:pointer;
  letter-spacing:0.5px; display:flex; align-items:center; gap:6px;
}
.const-btn:hover{ background:rgba(199,125,255,0.18); }
.const-panel{
  position:absolute; top:calc(100% + 8px); left:0;
  width:min(420px, 90vw);
  max-height:360px;
  background:#0A0F1A; border:1px solid var(--line-strong); border-radius:10px;
  box-shadow:0 18px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(199,125,255,0.15);
  z-index:40;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.const-panel input{ margin:10px; width:calc(100% - 20px); }
.const-list{ overflow-y:auto; padding:0 6px 8px; }
.const-item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:8px 10px; border-radius:6px; cursor:pointer; font-size:12px;
}
.const-item:hover{ background:rgba(63,224,208,0.10); }
.const-item .c-name{ color:var(--text); }
.const-item .c-val{ color:var(--accent); font-size:11px; white-space:nowrap; }
.const-empty{ padding:14px; text-align:center; color:var(--text-dim2); font-size:12px; }

</style>

<script>
/* ---- math engine with DEG/RAD-aware trig ---- */
const mx = math.create(math.all, {});
function getAngleMode(){ return localStorage.getItem('vanta_sci_angle') || 'rad'; }
function setAngleMode(m){ localStorage.setItem('vanta_sci_angle', m); }
function toRad(v){ return getAngleMode()==='deg' ? v*Math.PI/180 : v; }
function fromRad(v){ return getAngleMode()==='deg' ? v*180/Math.PI : v; }
mx.import({
  sin:  x => typeof x==='number' ? Math.sin(toRad(x)) : math.sin(x),
  cos:  x => typeof x==='number' ? Math.cos(toRad(x)) : math.cos(x),
  tan:  x => typeof x==='number' ? Math.tan(toRad(x)) : math.tan(x),
  asin: x => typeof x==='number' ? fromRad(Math.asin(x)) : math.asin(x),
  acos: x => typeof x==='number' ? fromRad(Math.acos(x)) : math.acos(x),
  atan: x => typeof x==='number' ? fromRad(Math.atan(x)) : math.atan(x),
}, {override:true});
mx.import({
  toPolar: (x,y) => [Math.sqrt(x*x+y*y), fromRad(Math.atan2(y,x))],
  toRect:  (r,theta) => { const rad = toRad(theta); return [r*Math.cos(rad), r*Math.sin(rad)]; },
}, {override:true});
function prettyExpr(e){
  return e.replaceAll('×','*').replaceAll('÷','/').replaceAll('π','pi').replaceAll('√','sqrt')
          .replaceAll('∛','cbrt').replaceAll('⁄','/')
          .replace(/(\d+(\.\d+)?|\))!/g,'factorial($1)');
}

/* ---- unicode superscript helpers: real math notation instead of ^ or e-notation ---- */
const SUPER_MAP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};
const SUPER_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const SUP_ALLOWED = /^[0-9\-]$/;
function toSuperChar(ch){ return SUPER_DIGITS[ch] !== undefined ? SUPER_DIGITS[ch] : ch; }
function toSuperscriptExponent(n){ return String(n).split('').map(toSuperChar).join(''); }
function convertSuper(s){
  const chars = Object.keys(SUPER_MAP).join('');
  const re = new RegExp('['+chars+']+','g');
  return s.replace(re, (m) => '^(' + m.split('').map(c=>SUPER_MAP[c]).join('') + ')');
}
let supMode = false;
function enterSupMode(){ supMode = true; }
function exitSupMode(){ supMode = false; }

/* ---- result formatting: "m × 10ⁿ" instead of e-notation, (r, θ) for polar pairs ---- */
let engMode = false;
function formatResult(value){
  if(value && typeof value === 'object'){
    let arr = Array.isArray(value) ? value : (typeof value.toArray==='function' ? (()=>{ try{ return value.toArray(); }catch(e){ return null; } })() : null);
    if(arr && arr.length===2 && typeof arr[0]==='number' && typeof arr[1]==='number'){
      return `(${formatResult(arr[0])}, ${formatResult(arr[1])})`;
    }
  }
  if(typeof value !== 'number' || !isFinite(value)){
    try{ return mx.format(value, {precision:12}); }catch(e){ return String(value); }
  }
  if(value === 0) return '0';
  const absVal = Math.abs(value);
  const HIGH = 1e10, LOW = 1e-9;
  if(engMode || absVal >= HIGH || absVal < LOW){
    let exp = Math.floor(Math.log10(absVal));
    if(engMode) exp = Math.floor(exp/3)*3;
    let mantissa = value / Math.pow(10, exp);
    let mStr = parseFloat(mantissa.toPrecision(8)).toString();
    if(Math.abs(parseFloat(mStr)) >= 10){ mantissa = mantissa/10; exp += 1; mStr = parseFloat(mantissa.toPrecision(8)).toString(); }
    return `${mStr} × 10${toSuperscriptExponent(exp)}`;
  }
  return mx.format(value, {precision:12});
}

/* ---- expression preprocessing: percent + factorial (via prettyExpr) + superscript ---- */
function toEvaluable(raw){
  let c = prettyExpr(raw);
  c = c.replace(/(\d+(\.\d+)?|\))%/g, '($1/100)');
  c = convertSuper(c);
  return c;
}

/* ---- STO/RCL variable memory (A-F, X, Y; M shares the existing Memory register) ---- */
function loadVars(){ try{ return JSON.parse(localStorage.getItem('vanta_sci_vars')||'{}'); }catch(e){ return {}; } }
function saveVars(){ localStorage.setItem('vanta_sci_vars', JSON.stringify(vars)); }
let vars = loadVars();
/* ---- physical constants library ---- */
const constants = [
  ['Proton mass','1.6726219e-27'],
  ['Neutron mass','1.6750e-27'],
  ['Electron mass','9.10938356e-31'],
  ['Muon mass','1.8835312e-28'],
  ['Bohr Radius','5.291772108e-11'],
  ['Planck constant','6.62607015e-34'],
  ['Nuclear magneton','5.05078324e-27'],
  ['Bohr magneton','9.2740100783e-24'],
  ['Planck constant-rationalized','3.6260314e-34'],
  ['Fine-Structure constant','7.2973525693e-3'],
  ['Classical electron radius','2.8179403227e-15'],
  ['Compton wavelength','2.426310238e-12'],
  ['Proton gyromagnetic ratio','2.6750132e8'],
  ['Proton Compton wavelength','2.426310238e-12'],
  ['Neutron Compton wavelength','2.426310238e-12'],
  ['Rydberg constant','1.097373e7'],
  ['Atomic mass constant','1.66053906660e-27'],
  ['Proton magnetic moment','1.4106047e-26'],
  ['Electron magnetic moment','9.284764e-24'],
  ['Neutron magnetic moment','-9.6629e-27'],
  ['Muon magnetic moment','-4.490e-26'],
  ['Faraday constant','9.649474e4'],
  ['Elementary charge','1.602176634e-19'],
  ['Avogadro constant','6.02214076e23'],
  ['Boltzmann constant','1.380649e-23'],

  ['Molar gas constant','8.3145'],
  ['Speed of light in vacuum','299792458'],
  ['First radiation constant','3.74177e-16'],
  ['Second radiation constant','1.438777e-2'],
  ['Stefan-Boltzmann constant','5.670374419e-8'],
  ['Electric constant','8.854187817e-12'],
  ['Magnetic constant','1.256637061e-6'],
  ['Magnetic flux quantum','2.067833831e-15'],
  ['Standard acceleration due to gravity','9.80665'],
  ['Conductance quantum','7.7480917e-5'],

  ['Celsius temperature offset','273.15'],

/* ---- history + memory (persisted via localStorage, shared across pages) ---- */
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('vanta_history')||'[]'); }catch(e){ return []; } }
function saveHistoryArr(h){ localStorage.setItem('vanta_history', JSON.stringify(h.slice(0,60))); }
function pushHistory(e,r){
  const h = loadHistory();
  h.unshift({ e, r, t:Date.now() });
  saveHistoryArr(h);
  renderHistory();
}
function renderHistory(){
  const el = document.getElementById('histList');
  if(!el) return;
  const h = loadHistory();
  if(h.length===0){ el.innerHTML = '<div class="hist-empty">No calculations yet</div>'; return; }
  el.innerHTML = h.map(x=>`<div class="hist-item" data-expr="${encodeURIComponent(x.r)}"><div class="h-expr">${x.e}</div><div class="h-res">${x.r}</div></div>`).join('');
  el.querySelectorAll('.hist-item').forEach(it=>{
    it.addEventListener('click',()=>{
      document.dispatchEvent(new CustomEvent('vanta:reuse', { detail: decodeURIComponent(it.dataset.expr) }));
    });
  });
}
function getMemory(){ return Number(localStorage.getItem('vanta_memory')||'0'); }
function setMemory(v){ localStorage.setItem('vanta_memory', String(v)); refreshMemUI(); }
function getLastAnswer(){ return Number(localStorage.getItem('vanta_lastAnswer')||'0'); }
function setLastAnswer(v){ localStorage.setItem('vanta_lastAnswer', String(v)); }
function refreshMemUI(){
  const el = document.getElementById('memVal');
  if(el) el.textContent = (typeof mx!=='undefined' ? mx.format(getMemory(),{precision:8}) : String(getMemory()));
}
function wireSidebar(){
  const clearBtn = document.getElementById('clearHist');
  if(clearBtn) clearBtn.addEventListener('click',()=>{ saveHistoryArr([]); renderHistory(); });
  const mPlus = document.getElementById('mPlus');
  const mMinus = document.getElementById('mMinus');
  const mR = document.getElementById('mR');
  const mC = document.getElementById('mC');
  if(mPlus) mPlus.addEventListener('click',()=> setMemory(getMemory()+getLastAnswer()));
  if(mMinus) mMinus.addEventListener('click',()=> setMemory(getMemory()-getLastAnswer()));
  if(mR) mR.addEventListener('click',()=>{
    document.dispatchEvent(new CustomEvent('vanta:reuse', { detail: String(getMemory()) }));
  });
  if(mC) mC.addEventListener('click',()=> setMemory(0));
  renderHistory();
  refreshMemUI();
}
wireSidebar();
/* ===== Calculator page (Standard/Scientific merged) ===== */
let expr = '';
const curLine = document.getElementById('curLine');
const prevLine = document.getElementById('prevLine');
const errTag = document.getElementById('errTag');

function renderExpr(){ curLine.value = expr === '' ? '0' : expr; }
function insert(v){ expr += v; errTag.textContent = ''; renderExpr(); }
function clearAll(){ expr=''; renderExpr(); prevLine.textContent='\u00A0'; errTag.textContent=''; }
function delOne(){ expr = expr.slice(0,-1); renderExpr(); }

function evaluate(){
  if(!expr) return;
  try{
    const clean = toEvaluable(expr);
    const result = mx.evaluate(clean, vars);
    const val = formatResult(result);
    prevLine.textContent = expr + ' =';
    if(typeof result === 'number') setLastAnswer(result);
    expr = val;
    sdIsFraction = false;
    renderExpr();
    pushHistory(prevLine.textContent.replace(/ =$/,''), val);
  }catch(err){
    errTag.textContent = 'SYNTAX ERR';
  }
}
function getCurrentNumericValue(){
  try{
    const r = mx.evaluate(toEvaluable(expr), vars);
    return typeof r === 'number' ? r : NaN;
  }catch(e){ return getLastAnswer(); }
}
function applyDMS(){
  const v = getCurrentNumericValue();
  if(!isFinite(v)) return;
  const sign = v<0 ? '-' : '';
  const av = Math.abs(v);
  const d = Math.floor(av);
  const mFull = (av-d)*60;
  const m = Math.floor(mFull);
  const s = (mFull-m)*60;
  expr = `${sign}${d}°${m}'${s.toFixed(2)}"`;
  renderExpr();
}
let sdIsFraction = false;
function toggleSD(){
  const v = getCurrentNumericValue();
  if(!isFinite(v)) return;
  if(!sdIsFraction){
    try{
      const f = mx.fraction(v);
      const sign = f.s < 0 ? '-' : '';
      expr = `${sign}${f.n}⁄${f.d}`;
      sdIsFraction = true;
    }catch(e){ return; }
  } else {
    expr = formatResult(v);
    sdIsFraction = false;
  }
  renderExpr();
}

/* keypad */
const sciKeys = [
  ['(',''],[')',''],['π',''],['e',''],['n!',''],
  ['sin','fn'],['cos','fn'],['tan','fn'],['ln','fn'],['log','fn'],
  ['√','fn'],['x²','fn'],['x^y','fn'],['10^x','fn'],['e^x','fn'],
  ['∛','fn'],['x³','fn'],['x⁻¹','fn'],['ⁿ√','fn'],['i','fn'],
  ['nPr','fn'],['nCr','fn'],['Pol(','fn'],['Rec(','fn'],['DMS','fn'],
  ['STO','fn'],['RCL','fn'],['Ran#','fn'],['RanInt','fn'],['HYP','fn'],
  ['7',''],['8',''],['9',''],['÷','op'],['AC','warn'],
  ['4',''],['5',''],['6',''],['×','op'],['DEL','warn'],
  ['1',''],['2',''],['3',''],['-','op'],['%','op'],
  ['0',''],['.',''],['Ans','fn'],['+','op'],['=','eq'],
];
const padSci = document.getElementById('padScientific');
let hypMode = false;
sciKeys.forEach(([label,cls])=>{
  const b = document.createElement('button');
  b.className = 'key '+cls;
  b.textContent = label;
  if(label==='STO'){
    b.addEventListener('click',(e)=>{ e.stopPropagation(); openVarPicker('STO', b); });
  } else if(label==='RCL'){
    b.addEventListener('click',(e)=>{ e.stopPropagation(); openVarPicker('RCL', b); });
  } else if(label==='HYP'){
    b.addEventListener('click',()=>{ hypMode=!hypMode; b.classList.toggle('toggleon',hypMode); });
  } else {
    b.addEventListener('click',()=>handleSciKey(label));
  }
  padSci.appendChild(b);
});

let invMode = false;
document.getElementById('degBtn').addEventListener('click',()=>{ setAngleMode('deg'); syncAngleUI(); });
document.getElementById('radBtn').addEventListener('click',()=>{ setAngleMode('rad'); syncAngleUI(); });
document.getElementById('invBtn').addEventListener('click',(e)=>{ invMode=!invMode; e.target.classList.toggle('toggleon',invMode); });
function syncAngleUI(){
  const mode = getAngleMode();
  document.getElementById('degBtn').classList.toggle('on', mode==='deg');
  document.getElementById('radBtn').classList.toggle('on', mode==='rad');
  const tag = document.getElementById('angleTag');
  tag.textContent = mode.toUpperCase();
  tag.classList.remove('hidden');
}
syncAngleUI();

function handleSciKey(label){
  if(supMode && !SUP_ALLOWED.test(label) && !['x^y','10^x','e^x'].includes(label)){
    exitSupMode();
  }
  switch(label){
    case 'AC': return clearAll();
    case 'DEL': return delOne();
    case '=': return evaluate();
    case 'π': return insert('π');
    case 'e': return insert('e');
    case 'n!': return insert('!');
    case '√': return insert('√(');
    case '∛': return insert('∛(');
    case 'ⁿ√': return insert('nthRoot(');
    case 'x²': return insert('²');
    case 'x³': return insert('³');
    case 'x⁻¹': return insert('⁻¹');
    case 'x^y': enterSupMode(); return;
    case '10^x': insert('10'); enterSupMode(); return;
    case 'e^x': insert('e'); enterSupMode(); return;
    case 'i': return insert('i');
    case 'nPr': return insert('permutations(');
    case 'nCr': return insert('combinations(');
    case 'Pol(': return insert('toPolar(');
    case 'Rec(': return insert('toRect(');
    case 'Ran#': return insert('random()');
    case 'RanInt': return insert('randomInt(');
    case 'DMS': return applyDMS();
    case 'Ans': return insert(formatResult(getLastAnswer()));
    case 'sin': case 'cos': case 'tan': {
      let fname = label;
      if(hypMode && invMode) fname = 'a'+label+'h';
      else if(hypMode) fname = label+'h';
      else if(invMode) fname = {sin:'asin',cos:'acos',tan:'atan'}[label];
      return insert(fname+'(');
    }
    case 'ln': return insert('log(');
    case 'log': return insert('log10(');
    default:
      if(supMode && SUP_ALLOWED.test(label)) return insert(toSuperChar(label));
      return insert(label);
  }
}

/* keyboard support */
document.addEventListener('keydown',(e)=>{
  if(e.key==='^'){ enterSupMode(); return; }
  if(/[0-9\-]/.test(e.key) && supMode){ insert(toSuperChar(e.key)); return; }
  if(/[0-9+\-*/.()]/.test(e.key)){ insert(e.key==='*'?'×':e.key==='/'?'÷':e.key); }
  else if(e.key==='Enter'){ evaluate(); }
  else if(e.key==='Backspace'){ delOne(); }
  else if(e.key==='Escape'){ clearAll(); }
});

/* physical constants dropdown */
const constListEl = document.getElementById('constList');
const constSearch = document.getElementById('constSearch');
const constPanel = document.getElementById('constPanel');
const constToggle = document.getElementById('constToggle');
function renderConstants(filter=''){
  const f = filter.trim().toLowerCase();
  const rows = constants.filter(([name])=>name.toLowerCase().includes(f));
  if(rows.length===0){ constListEl.innerHTML = '<div class="const-empty">No matches</div>'; return; }
  constListEl.innerHTML = rows.map(([name,val])=>
    `<div class="const-item" data-val="${val}"><span class="c-name">${name}</span><span class="c-val">${val}</span></div>`
  ).join('');
  constListEl.querySelectorAll('.const-item').forEach(item=>{
    item.addEventListener('click',()=>{ insert(item.dataset.val); closeConstPanel(); });
  });
}
function openConstPanel(){ constPanel.classList.remove('hidden'); renderConstants(constSearch.value); constSearch.focus(); }
function closeConstPanel(){ constPanel.classList.add('hidden'); constSearch.value=''; }
constToggle.addEventListener('click',(e)=>{
  e.stopPropagation();
  constPanel.classList.contains('hidden') ? openConstPanel() : closeConstPanel();
});
constSearch.addEventListener('input',()=>renderConstants(constSearch.value));
constSearch.addEventListener('click',(e)=>e.stopPropagation());
document.addEventListener('click',(e)=>{
  if(!constPanel.contains(e.target) && e.target!==constToggle) closeConstPanel();
});
renderConstants();

/* STO/RCL variable picker (A-F, X, Y; M shares the existing Memory register) */
const varPanel = document.createElement('div');
varPanel.className = 'const-panel hidden';
varPanel.style.position = 'fixed';
document.body.appendChild(varPanel);
const VAR_LETTERS = ['A','B','C','D','E','F','X','Y','M'];
let varMode = 'STO';
function openVarPicker(mode, btnEl){
  varMode = mode;
  const rect = btnEl.getBoundingClientRect();
  varPanel.style.left = rect.left + 'px';
  varPanel.style.top = (rect.bottom + 6) + 'px';
  varPanel.innerHTML = `<div style="padding:10px; display:grid; grid-template-columns:repeat(3,1fr); gap:6px;">` +
    VAR_LETTERS.map(l=>`<button class="key" data-var="${l}" style="padding:8px 4px;">${l}</button>`).join('') +
    `</div>`;
  varPanel.querySelectorAll('[data-var]').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      const letter = btn.dataset.var;
      if(varMode==='STO'){
        const val = getCurrentNumericValue();
        if(letter==='M') setMemory(val); else { vars[letter]=val; saveVars(); }
      } else {
        if(letter==='M') insert(formatResult(getMemory()));
        else insert(letter);
      }
      varPanel.classList.add('hidden');
    });
  });
  varPanel.classList.remove('hidden');
}
document.addEventListener('click',(e)=>{
  if(!varPanel.contains(e.target)) varPanel.classList.add('hidden');
});

/* S⇔D (fraction/decimal toggle) + ENG (engineering notation toggle) */
document.getElementById('sdBtn').addEventListener('click', toggleSD);
document.getElementById('engBtn').addEventListener('click',(e)=>{ engMode=!engMode; e.target.classList.toggle('on',engMode); });

/* reuse from history / memory recall */
document.addEventListener('vanta:reuse',(e)=>{ expr = e.detail; renderExpr(); });

renderExpr();

</script>
